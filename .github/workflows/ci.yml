name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '21 7 * * 0' # run weekly on sundays

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        django:
        - '4.2'
        - '5.2'
        - '6.0'
        - 'main'
        exclude:
          - python-version: '3.10'
            django: '6.0'
          - python-version: '3.10'
            django: 'main'
          - python-version: '3.11'
            django: 'main'
          - python-version: '3.11'
            django: '6.0'
          - python-version: '3.12'
            django: '4.2'
          - python-version: '3.13'
            django: '4.2'
          - python-version: '3.14'
            django: '4.2'

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/test
      with:
        python-version: ${{ matrix.python-version }}
        django-version: ${{ matrix.django }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: install flake8
      run: pip install flake8

    - name: Lint with flake8
      run: |
        ./run.sh flake8
